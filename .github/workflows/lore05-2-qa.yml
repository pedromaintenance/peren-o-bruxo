name: LORE-05.2 Debts of the Dead QA

on:
  pull_request:
    paths:
      - '.github/workflows/lore05-2-qa.yml'
      - 'phaser-demo-m1hf/**'
      - 'tests/qa_lore05_2*'
      - 'tests/qa_lore04.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All previous narrative saves and new investigations
        run: |
          node --test tests/qa_lore02.mjs tests/qa_lore03.mjs tests/qa_lore04.mjs tests/qa_lore04_conselho.mjs tests/qa_lore04_expedicao.mjs tests/qa_lore05_rio.mjs tests/qa_lore05_2_dividas.mjs
      - name: Prepare Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Serve candidate
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/peren-debts.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/phaser-demo-m1hf/campanha.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/peren-debts.log
          exit 1
      - name: Playwright regression and mobile/offline acceptance
        env:
          LORE02_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
          LORE03_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
          LORE04_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
          LORE05_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
          LORE052_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: |
          node tests/qa_lore02_browser.mjs
          node tests/qa_lore03_browser.mjs
          node tests/qa_lore04_browser.mjs
          node tests/qa_lore04_conselho_browser.mjs
          node tests/qa_lore04_expedicao_browser.mjs
          node tests/qa_lore05_rio_browser.mjs
          node tests/qa_lore05_2_browser.mjs
