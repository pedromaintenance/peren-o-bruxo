name: Peren — Erva animada e PWA
on:
  push:
    branches: [main]
    paths:
      - 'assets/icons/erva.webp'
      - 'assets/icons/erva-animation.json'
      - 'assets/icons/sources/erva-5poses-original.png'
      - 'sw.js'
      - 'tests/qa_peren_erva_animation.mjs'
      - '.github/workflows/peren-herb-animation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check game.js
      - run: node --test tests/qa_peren_erva_animation.mjs
