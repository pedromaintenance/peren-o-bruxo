name: Phaser M1c - combate por turnos
on:
  push:
    branches: ["feature/phaser-m1c-combate"]
    paths: ["phaser-lab/**", "phaser/assets/vfx/**", "phaser/assets/battle/**", ".github/workflows/phaser-m1c.yml"]
  pull_request:
    paths: ["phaser-lab/**", "phaser/assets/vfx/**", "phaser/assets/battle/**", ".github/workflows/phaser-m1c.yml"]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Conferir catálogo, sprites e VFX
        run: |
          python -m pip install pillow
          python tools/test_monsters_art.py
          python tools/test_murin_battle_fx.py
          python tools/generate_visual_manifest.py --check
      - name: Instalar Phaser e Playwright
        working-directory: phaser-lab
        run: npm install --no-audit --no-fund
      - name: Testar combate determinístico, economia e gamepad
        working-directory: phaser-lab
        run: npm test
      - name: Empacotar Phaser sem CDN
        working-directory: phaser-lab
        run: npm run build
      - name: Instalar Chromium
        working-directory: phaser-lab
        run: npx playwright install --with-deps chromium
      - name: Combater, lançar feitiços, vencer e fugir em navegador mobile
        working-directory: phaser-lab
        run: |
          (npm run preview -- --host 127.0.0.1 > /tmp/peren-preview-m1c.log 2>&1 &)
          for i in $(seq 1 35); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break || sleep 1; done
          npm run test:e2e
      - name: Salvar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peren-murin-m1c-qa
          path: phaser-lab/screenshots/*.png
          if-no-files-found: ignore
