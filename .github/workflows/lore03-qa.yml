name: LORE-03 Modes & Saves QA

on:
  pull_request:
    paths:
      - '.github/workflows/lore03-qa.yml'
      - 'phaser-demo-m1hf/**'
      - 'tests/qa_lore03*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and isolated-save checks
        run: |
          node --test tests/qa_lore02.mjs
          node --test tests/qa_lore03.mjs
      - name: Prepare Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Run local HTTP server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/lore03-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/phaser-demo-m1hf/modos.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lore03-server.log
          exit 1
      - name: Chromium navigation saves downloads and offline
        env:
          LORE02_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
          LORE03_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: |
          node tests/qa_lore02_browser.mjs
          node tests/qa_lore03_browser.mjs
