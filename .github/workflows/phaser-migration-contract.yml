name: Phaser — fonte, dados canônicos e contratos alquímicos
on:
  pull_request:
    paths:
      - 'phaser-lab/**'
      - 'phaser/assets/**'
      - 'data/**'
      - '.github/workflows/phaser-migration-contract.yml'
  push:
    branches: [main]
    paths:
      - 'phaser-lab/**'
      - 'phaser/assets/**'
      - 'data/**'
      - '.github/workflows/phaser-migration-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phaser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: phaser-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências do motor Phaser
        run: npm install --no-audit --no-fund
      - name: Sincronizar dados canônicos e derivar atlas temporário sem perdas
        run: node scripts/sync-assets.mjs
      - name: Testar contratos M0, mundo, combate e transações
        run: node --test tests/alchemy-discovery.test.mjs tests/alchemy-source-contract.test.mjs tests/atlas-normalization.test.mjs tests/world.test.mjs tests/combat.test.mjs tests/progress.test.mjs tests/ui-inventory.test.mjs tests/ui-marketplace.test.mjs tests/ui-workshop.test.mjs
      - name: Compilar Phaser com catálogos da raiz
        run: npm run build
      - name: Instalar Chromium para a prova da bancada real
        run: npx playwright install chromium --with-deps
      - name: Iniciar prévia de build
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/peren-phaser-preview.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:4173/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/peren-phaser-preview.log
          exit 1
      - name: Navegar e testar a bancada alquímica
        run: node scripts/alchemy-browser-smoke.mjs
