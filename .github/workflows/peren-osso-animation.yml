name: Peren — Osso animado e PWA
on:
  push:
    branches: [main]
    paths:
      - 'assets/icons/osso.webp'
      - 'assets/icons/osso-animation.json'
      - 'assets/icons/sources/osso-5poses-original.png'
      - 'sw.js'
      - 'tests/qa_peren_osso_animation.mjs'
      - '.github/workflows/peren-osso-animation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bone icon frames and integration
        run: node --test tests/qa_peren_osso_animation.mjs
