name: Peren — Integrar caminhada v6 no atlas
on:
  push:
    branches: [main]
    paths:
      - 'phaser-demo-m1hf/art/characters/peren/official-v6/peren-walk-originals.zip'
      - 'ferramentas/atualizar_caminhada_v6.py'
      - '.github/workflows/peren-walk-v6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Instalar Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Gerar atlas e verificar recortes
        run: |
          python ferramentas/atualizar_caminhada_v6.py
          python tests/qa_peren_walk_v6.py
      - name: Atualizar cache PWA somente depois de gerar PNGs reais
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phaser-demo-m1hf/demo-sw.js');s=p.read_text()
          import re
          s=re.sub(r'const CACHE="peren-phaser-m1hf-preview-[^"]+";', 'const CACHE="peren-phaser-m1hf-preview-infernal-v90-walk-v27-20261027";',s,count=1)
          items=['./art/characters/peren/official-v6/peren-walk-4-directions-5frames-224x260.png','./art/characters/peren/official-v6/manifest.json']
          for item in items:
              if '"'+item+'"' not in s:
                  s=s.replace('const FILES=[','const FILES=["'+item+'",',1)
          p.write_text(s)
          PY
      - name: Commitar apenas arte, proveniência e cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phaser-demo-m1hf/art/characters/peren/peren-atlas.png phaser-demo-m1hf/art/characters/peren/atlas.json phaser-demo-m1hf/art/characters/peren/official-v6 phaser-demo-m1hf/demo-sw.js
          git diff --cached --quiet || (git commit -m 'Peren: ativar caminhada v6 em quatro direções sem alterar ações e saves' && git push origin HEAD:main)
