name: Peren Official Art QA
on:
  pull_request:
    paths:
      - '.github/workflows/peren-official-art-qa.yml'
      - 'phaser-demo-m1hf/**'
      - 'phaser-demo/**'
      - 'game.js'
      - 'style.css'
      - 'sw.js'
      - 'README.md'
      - 'lore/peren/**'
      - 'ferramentas/gerar_peren_runtime.py'
      - 'ferramentas/gerar_peren_caminhada_v3.py'
      - 'ferramentas/gerar_peren_ferido_v4.py'
      - 'ferramentas/gerar_peren_coleta_ervas_v5.py'
      - 'ferramentas/importar_peren_batalha_v6.py'
      - 'tests/qa_peren_v6_assets.mjs'
      - 'tests/qa_peren_summon_greater_demon.mjs'
      - 'ferramentas/importar_summon_greater_demon.py'
      - 'tests/qa_peren_oficial*'
      - 'tests/qa_single_free_mode*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sprite compatibility, provenance, saves and one-game contract
        run: |
          node --check game.js
          node --check phaser-demo-m1hf/assets/game-B5Gp97dd.js
          python3 -m py_compile ferramentas/importar_summon_greater_demon.py ferramentas/importar_peren_batalha_v6.py ferramentas/gerar_peren_runtime.py ferramentas/gerar_peren_caminhada_v3.py ferramentas/gerar_peren_ferido_v4.py ferramentas/gerar_peren_coleta_ervas_v5.py
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 tests/qa_peren_frames.py
          python3 tests/qa_peren_walk_v3.py
          python3 tests/qa_peren_wounded_v4.py
          python3 tests/qa_peren_ervas_v5.py
          node --test tests/qa_single_free_mode.mjs tests/qa_peren_oficial.mjs tests/qa_peren_wounded_v4.mjs tests/qa_peren_ervas_v5.mjs tests/qa_peren_v6_assets.mjs tests/qa_peren_summon_greater_demon.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Serve sandbox and previews
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/peren-asset-qa.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/phaser-demo-m1hf/peren-arte.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/peren-asset-qa.log
          exit 1
      - name: Single-mode browser
        env:
          PEREN_SITE_ORIGIN: http://127.0.0.1:8765
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 90s node tests/qa_single_free_mode_browser.mjs
      - name: Official art browser
        env:
          PEREN_SITE_ORIGIN: http://127.0.0.1:8765
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 90s node tests/qa_peren_oficial_browser.mjs
      - name: Phaser in-game browser
        env:
          PEREN_SITE_ORIGIN: http://127.0.0.1:8765
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 90s node tests/qa_peren_phaser_browser.mjs
      - name: Wounded walk browser
        env:
          PEREN_SITE_ORIGIN: http://127.0.0.1:8765
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 90s node tests/qa_peren_wounded_v4_browser.mjs
      - name: Herb-only collection browser
        env:
          PEREN_SITE_ORIGIN: http://127.0.0.1:8765
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 90s node tests/qa_peren_ervas_v5_browser.mjs
      - name: Share in-game screenshot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peren-frames-v2-screenshots
          path: artifacts/peren-v2-forest-*.png
          if-no-files-found: ignore
