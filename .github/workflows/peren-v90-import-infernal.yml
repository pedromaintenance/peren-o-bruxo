name: Peren v9.0 Import Infernal
on:
  push:
    branches:
      - feature/peren-v90-infernal-refined
    paths:
      - 'asset-ingest/Peren_Infernal_v90_GitHub_Ingest.zip'
permissions:
  contents: write
  actions: write
concurrency:
  group: peren-v90-ingest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import-exact-artist-approved-image:
    if: github.repository == 'pedromaintenance/peren-o-bruxo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/peren-v90-infernal-refined
          persist-credentials: true
      - name: Verify the exact approved ZIP, not an altered export
        shell: bash
        run: |
          set -euo pipefail
          FILE=asset-ingest/Peren_Infernal_v90_GitHub_Ingest.zip
          test -f "$FILE"
          echo "ad53107a88c542054bf90e9b85a89819b453f9f20114ed17a876764ff969aa7e  $FILE" | sha256sum -c -
          test "$(git branch --show-current)" = feature/peren-v90-infernal-refined
      - name: Import approved Infernal 543x362 atlas without rewriting other sprites
        run: |
          python3 ferramentas/instalar_infernal_v90.py asset-ingest/Peren_Infernal_v90_GitHub_Ingest.zip
          node --test tests/qa_peren_infernal_v90.mjs
      - name: Commit single PNG and remove upload ZIP
        id: commit_image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- phaser-demo-m1hf/art/battle/runtime-v84/infernal-v90.png
          git rm -- asset-ingest/Peren_Infernal_v90_GitHub_Ingest.zip
          python3 - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines())
          expected={"asset-ingest/Peren_Infernal_v90_GitHub_Ingest.zip",
                    "phaser-demo-m1hf/art/battle/runtime-v84/infernal-v90.png"}
          if staged != expected:
              raise SystemExit("Unexpected changes: "+repr(sorted(staged.symmetric_difference(expected))))
          PY
          git commit -m "assets(peren): add approved Infernal v9.0 sprite atlas, eight 543x362 frames"
          git push origin HEAD:refs/heads/feature/peren-v90-infernal-refined
      - name: Start the full official art test suite on the image commit
        if: ${{ always() && steps.commit_image.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run peren-official-art-qa.yml --ref feature/peren-v90-infernal-refined
