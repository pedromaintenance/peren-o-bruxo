name: Peren — Cristal animado e PWA
on:
  push:
    branches: [main]
    paths:
      - 'assets/icons/cristal.webp'
      - 'assets/icons/cristal-animation.json'
      - 'assets/icons/sources/cristal-5poses-original.png'
      - 'assets/icons/sources/cristal-legacy-static.webp'
      - 'sw.js'
      - 'tests/qa_peren_cristal_animation.mjs'
      - '.github/workflows/peren-crystal-animation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game JS and animated crystal integrity
        run: |
          node --check game.js
          node --test tests/qa_peren_cristal_animation.mjs
