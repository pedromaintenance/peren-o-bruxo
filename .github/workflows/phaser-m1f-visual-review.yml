name: Phaser M1f - galeria de sprites
on:
  push:
    branches: [feature/phaser-m1f-galeria-visual]
    paths:
      - 'phaser-lab/**'
      - '.github/workflows/phaser-m1f-visual-review.yml'
  pull_request:
    paths:
      - 'phaser-lab/**'
      - '.github/workflows/phaser-m1f-visual-review.yml'
permissions:
  contents: read
jobs:
  review-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: phaser-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar regras, save e a galeria
        run: npm test
      - name: Empacotar jogo e galeria juntos
        run: npm run build
      - name: Preparar demo com PWA isolado
        run: node scripts/prepare-demo.mjs
      - name: Conferir entradas e assets dos quatro personagens
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/review.html
          grep -q 'Ateliê de Sprites' dist/review.html
          test -s dist/art/characters/peren/peren-atlas.png
          for id in mob-galho-infectado mob-fungo-violeta mob-ettercap; do
            test -s "dist/art/monsters/$id/atlas.png"
          done
          test -s dist/demo-sw.js
          echo 'Galeria e jogo compilados, sem mudanças na main'
