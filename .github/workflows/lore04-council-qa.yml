name: LORE-04 Eldroth Council QA

on:
  pull_request:
    paths:
      - '.github/workflows/lore04-council-qa.yml'
      - 'phaser-demo-m1hf/**'
      - 'tests/qa_lore04_conselho*'
      - 'ferramentas/importar_assets_peren.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compatibility, source integrity, and save-model QA
        run: |
          node --test tests/qa_lore02.mjs tests/qa_lore03.mjs tests/qa_lore04.mjs tests/qa_lore04_conselho.mjs
          python3 -m py_compile ferramentas/importar_assets_peren.py
      - name: Prepare Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Serve test build
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/lore04-council.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/phaser-demo-m1hf/campanha.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lore04-council.log
          exit 1
      - name: Browser and PWA QA
        env:
          LORE02_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
          LORE03_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
          LORE04_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: |
          node tests/qa_lore02_browser.mjs
          node tests/qa_lore03_browser.mjs
          node tests/qa_lore04_browser.mjs
          node tests/qa_lore04_conselho_browser.mjs
