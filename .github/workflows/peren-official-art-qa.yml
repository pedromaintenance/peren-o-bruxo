name: Peren Official Art QA
on:
  pull_request:
    paths:
      - '.github/workflows/peren-official-art-qa.yml'
      - 'phaser-demo-m1hf/**'
      - 'phaser-demo/**'
      - 'game.js'
      - 'style.css'
      - 'sw.js'
      - 'README.md'
      - 'lore/peren/**'
      - 'ferramentas/gerar_peren_runtime.py'
      - 'ferramentas/gerar_peren_caminhada_v3.py'
      - 'ferramentas/gerar_peren_ferido_v4.py'
      - 'ferramentas/gerar_peren_coleta_ervas_v5.py'
      - 'ferramentas/importar_peren_batalha_v6.py'
      - 'tests/qa_peren_v6_assets.mjs'
      - 'tests/qa_peren_summon_greater_demon.mjs'
      - 'ferramentas/importar_summon_greater_demon.py'
      - 'ferramentas/instalar_battle_art_v8.py'
      - 'tests/qa_peren_battle_art_runtime_v8.mjs'
      - 'tests/qa_peren_battler_v81.mjs'
      - 'tests/qa_peren_battler_v82_review.mjs'
      - 'tests/qa_peren_battle_v84.mjs'
      - 'tests/qa_peren_battle_v85_binary.mjs'
      - 'tests/qa_peren_battle_v85_browser.mjs'
      - 'tests/qa_peren_battle_diagnostics.mjs'
      - 'tests/qa_peren_battle_v89_offline.mjs'
      - 'tests/qa_peren_battle_v89_offline_browser.mjs'
      - 'tests/qa_peren_infernal_v90.mjs'
      - 'tests/qa_peren_sparks_v10.mjs'
      - 'tests/qa_peren_flame_v10.mjs'
      - 'tests/qa_peren_fire_elements_v11.mjs'
      - 'tests/qa_peren_ring_v12.mjs'
      - 'tests/qa_peren_burst_v13.mjs'
      - 'tests/qa_peren_blaze_v14.mjs'
      - 'tests/qa_peren_smoke_v15.mjs'
      - 'tests/qa_peren_hellskull_v16.mjs'
      - 'tests/qa_peren_firebolt_v19.mjs'
      - 'tests/qa_peren_casting_ice_v24.mjs'
      - 'tests/qa_peren_casting_darkness_v25.mjs'
      - 'tests/qa_peren_ice_shards_v26.mjs'
      - 'tests/qa_peren_skullcloud_v17.mjs'
      - 'ferramentas/instalar_infernal_v90.py'
      - 'ferramentas/instalar_battle_v84.py'
      - 'ferramentas/tratar_battlers_v82.py'
      - 'ferramentas/instalar_battlers_v81.py'
      - 'tests/qa_peren_oficial*'
      - 'tests/qa_single_free_mode*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sprite compatibility, provenance, saves and one-game contract
        run: |
          node --check game.js
          node --check phaser-demo-m1hf/assets/game-B5Gp97dd.js
          python3 -m py_compile ferramentas/instalar_infernal_v90.py ferramentas/instalar_battle_v84.py ferramentas/tratar_battlers_v82.py ferramentas/instalar_battlers_v81.py ferramentas/instalar_battle_art_v8.py ferramentas/importar_summon_greater_demon.py ferramentas/importar_peren_batalha_v6.py ferramentas/gerar_peren_runtime.py ferramentas/gerar_peren_caminhada_v3.py ferramentas/gerar_peren_ferido_v4.py ferramentas/gerar_peren_coleta_ervas_v5.py
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 tests/qa_peren_frames.py
          python3 tests/qa_peren_walk_v3.py
          python3 tests/qa_peren_wounded_v4.py
          python3 tests/qa_peren_ervas_v5.py
          node --test tests/qa_single_free_mode.mjs tests/qa_peren_oficial.mjs tests/qa_peren_wounded_v4.mjs tests/qa_peren_ervas_v5.mjs tests/qa_peren_v6_assets.mjs tests/qa_peren_summon_greater_demon.mjs tests/qa_peren_battle_art_runtime_v8.mjs tests/qa_peren_battler_v81.mjs tests/qa_peren_battler_v82_review.mjs tests/qa_peren_battle_v84.mjs tests/qa_peren_battle_diagnostics.mjs tests/qa_peren_battle_v89_offline.mjs
      # Unlike contract tests, this step fails when actual approved PNGs are absent.
      # Do not ship a release which only displays the previous exploration battler.
      - name: Release gate — require eight approved PNGs on the current PR
        run: node --test tests/qa_peren_battle_v85_binary.mjs
      - name: Infernal v9.0 release gate — require the exact approved PNG in this checkout
        run: node --test tests/qa_peren_infernal_v90.mjs
      - name: Spark v10 release gate — verify approved five-frame PNG is committed
        run: node --test tests/qa_peren_sparks_v10.mjs
      - name: Flame v10 release gate — verify original five-stage spritesheet
        run: node --test tests/qa_peren_flame_v10.mjs
      - name: Fire elements v11 release gate — require authentic Embers/Pupil PNGs
        run: node --test tests/qa_peren_fire_elements_v11.mjs
      - name: Ring v12 release gate — require authentic five-frame PNG
        run: node --test tests/qa_peren_ring_v12.mjs
      - name: Burst v13 release gate — verify real PNG and five-frame animation
        run: node --test tests/qa_peren_burst_v13.mjs
      - name: Labareda v14 release gate — verify real PNG and five frames
        run: node --test tests/qa_peren_blaze_v14.mjs
      - name: Smoke v15 release gate — require real RGBA sprite and 5 frames
        run: node --test tests/qa_peren_smoke_v15.mjs
      - name: Hell Skull v16 release gate — require source-faithful PNG and five frames
        run: node --test tests/qa_peren_hellskull_v16.mjs
      - name: Skull Cloud v17 release gate — verify the PNG and all 5 animation frames
        run: node --test tests/qa_peren_skullcloud_v17.mjs
      - name: Basic Fire Bolt v19 — original fire-lit caster, hand sparks, enemy flame and PWA
        run: node --test tests/qa_peren_firebolt_v19.mjs
      - name: Ice Casting v24 — verify approved RGBA PNG, four frames and offline cache
        run: node --test tests/qa_peren_casting_ice_v24.mjs
      - name: Darkness Casting v25 — verify seven original poses, fifteen ticks, height and offline cache
        run: node --test tests/qa_peren_casting_darkness_v25.mjs
      - name: Ice Shards v26 — original RGBA asset, five phases, enemy-only hit and no procedural ice
        run: node --test tests/qa_peren_ice_shards_v26.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Serve sandbox and previews
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/peren-asset-qa.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/phaser-demo-m1hf/peren-arte.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/peren-asset-qa.log
          exit 1
      - name: Single-mode browser
        env:
          PEREN_SITE_ORIGIN: http://127.0.0.1:8765
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 90s node tests/qa_single_free_mode_browser.mjs
      - name: Official art browser
        env:
          PEREN_SITE_ORIGIN: http://127.0.0.1:8765
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 90s node tests/qa_peren_oficial_browser.mjs
      - name: Phaser in-game browser
        env:
          PEREN_SITE_ORIGIN: http://127.0.0.1:8765
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 90s node tests/qa_peren_phaser_browser.mjs
      - name: Wounded walk browser
        env:
          PEREN_SITE_ORIGIN: http://127.0.0.1:8765
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 90s node tests/qa_peren_wounded_v4_browser.mjs
      - name: Herb-only collection browser
        env:
          PEREN_SITE_ORIGIN: http://127.0.0.1:8765
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 90s node tests/qa_peren_ervas_v5_browser.mjs
      - name: Release proof — real BattleScene with new Idle and spells
        env:
          PEREN_SITE_ORIGIN: http://127.0.0.1:8765
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 170s node tests/qa_peren_battle_v85_browser.mjs
      - name: Offline PWA battle art browser (mobile and desktop)
        env:
          PEREN_BASE_URL: http://127.0.0.1:8765/phaser-demo-m1hf
        run: timeout 170s node tests/qa_peren_battle_v89_offline_browser.mjs
      - name: Preserve real battle screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peren-v85-battle-real-scene
          path: |
            artifacts/peren-v85-*.png
            artifacts/peren-v10-*.png
          if-no-files-found: ignore
      - name: Share in-game screenshot proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peren-frames-v2-screenshots
          path: artifacts/peren-v2-forest-*.png
          if-no-files-found: ignore
